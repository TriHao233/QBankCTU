services:
  backend:
    volumes:
      - ./backend/main.py:/app/main.py:ro
      - ./backend/core/email_service.py:/app/core/email_service.py:ro
      - ./backend/modules/contact:/app/modules/contact:ro
      - ./backend/modules/users/schemas.py:/app/modules/users/schemas.py:ro
      - ./backend/db/migrations/0018_contact_requests.sql:/app/db/migrations/0018_contact_requests.sql:ro
      - ./backend/db/migrations/0019_contact_categories.sql:/app/db/migrations/0019_contact_categories.sql:ro
      - ./backend/db/migrations/0020_contact_lifecycle.sql:/app/db/migrations/0020_contact_lifecycle.sql:ro
      - ./backend/db/migrations/0021_user_approval.sql:/app/db/migrations/0021_user_approval.sql:ro
      - ./backend/modules/dictionary/dictionary.py:/app/modules/dictionary/dictionary.py:ro
      - ./backend/core/config.py:/app/core/config.py:ro
      - ./backend/core/bootstrap.py:/app/core/bootstrap.py:ro
      - ./backend/core/job_recovery.py:/app/core/job_recovery.py:ro
      - ./backend/modules/generation/llm:/app/modules/generation/llm:ro
      - ./backend/modules/generation/generate.py:/app/modules/generation/generate.py:ro
      - ./backend/modules/generation/mongodb.py:/app/modules/generation/mongodb.py:ro
      - ./backend/modules/generation/schemas.py:/app/modules/generation/schemas.py:ro
      - ./backend/modules/generation/postprocessing.py:/app/modules/generation/postprocessing.py:ro
      - ./backend/modules/generation/question.py:/app/modules/generation/question.py:ro
      - ./backend/modules/generation/prompt_builder.py:/app/modules/generation/prompt_builder.py:ro
      - ./backend/modules/questions/workflow_service.py:/app/modules/questions/workflow_service.py:ro
      - ./backend/modules/catalog/service.py:/app/modules/catalog/service.py:ro

  worker:
    volumes:
      - ./backend/core/config.py:/app/core/config.py:ro
      - ./backend/core/bootstrap.py:/app/core/bootstrap.py:ro
      - ./backend/core/job_recovery.py:/app/core/job_recovery.py:ro
      - ./backend/modules/generation/llm:/app/modules/generation/llm:ro
      - ./backend/modules/generation/generate.py:/app/modules/generation/generate.py:ro
      - ./backend/modules/generation/mongodb.py:/app/modules/generation/mongodb.py:ro
      - ./backend/modules/generation/schemas.py:/app/modules/generation/schemas.py:ro
      - ./backend/modules/generation/postprocessing.py:/app/modules/generation/postprocessing.py:ro
      - ./backend/modules/generation/question.py:/app/modules/generation/question.py:ro
      - ./backend/modules/generation/prompt_builder.py:/app/modules/generation/prompt_builder.py:ro
      - ./backend/modules/questions/workflow_service.py:/app/modules/questions/workflow_service.py:ro
      - ./backend/modules/catalog/service.py:/app/modules/catalog/service.py:ro

  frontend-dev:
    image: node:20-alpine
    container_name: nckh-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5177"
    ports:
      - "5177:5177"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
      VITE_PIPELINE_3D: ${VITE_PIPELINE_3D:-false}
      VITE_USE_POLLING: "true"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_dev_node_modules:
